<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ECON WIP TrackeR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F5F4FF;
    --paper:#100C22;
    --paper2:#170F30;
    --card:#211A42;
    --input:#1B1438;
    --steel:#FFFFFF;
    --steel-press:#ECECFC;
    --dim:#A79FD6;
    --dark-text:#171233;
    --blue:#5B8CFF;
    --blue-press:#3E6FE0;
    --amber:#FFB23E;
    --amber-tint:#FFEBD0;
    --rule:#2E2358;
    --danger:#FF5D77;
    --c1:#7C5CFF;
    --c2:#FF5DA2;
    --c3:#22D3C9;
    --c4:#FF9F43;
    --c5:#3DD68C;
    --c6:#5B8CFF;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family:var(--sans);
    background:#000;
    color:var(--ink);
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
  }
  #shell{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    background:radial-gradient(120% 55% at 15% 0%, #2A1E5C 0%, var(--paper) 45%), var(--paper);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
  }
  /* Desktop / wide viewports: drop the phone-card frame and use the full window */
  @media (min-width:900px){
    body{ align-items:stretch; }
    #shell{
      max-width:none;
      width:100vw;
      height:100vh;
      box-shadow:none;
    }
    .scroll{
      max-width:900px;
      margin:0 auto;
      width:100%;
    }
    .appbar-row, .search-wrap.open .search{
      max-width:900px;
      margin:0 auto;
    }
  }

  /* App bar */
  .appbar{
    flex:0 0 auto;
    padding:10px 12px 8px;
    background:transparent;
    border-bottom:1px solid var(--rule);
    position:relative;
    z-index:5;
  }
  .appbar-row{
    display:flex;
    align-items:center;
    gap:6px;
    min-height:28px;
  }
  .back-btn{
    width:30px; height:30px; flex:0 0 30px;
    border:none; background:var(--card); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border-radius:9px; color:var(--ink);
  }
  .back-btn:active{ background:#2E2358; }
  .appbar-title{
    font-size:16px; font-weight:700; letter-spacing:-0.01em;
    flex:1; text-align:center; margin-right:30px;
    background:linear-gradient(90deg, var(--c3), var(--c2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .appbar-title.mono{ font-family:var(--mono); font-size:14px; letter-spacing:0; }
  .appbar-title.root{ margin-right:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-size:15px; }
  .appbar-sub{
    text-align:center; font-size:11px; color:var(--dim); margin-top:2px;
    font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em;
  }
  .sync-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px;
    background:#5A5D68; vertical-align:middle;
  }
  .sync-dot.on{ background:#3DD68C; box-shadow:0 0 6px #3DD68C; }
  .sync-dot.err{ background:var(--danger); }

  /* Icon-only header buttons (Export / Users / Change PW / Logout) */
  .icon-btn{
    flex:0 0 auto; width:30px; height:30px; border:none; border-radius:9px;
    background:var(--card); color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
  }
  .icon-btn:active{ background:#2E2358; }
  .icon-btn .req-badge{ position:absolute; top:-3px; right:-3px; }
  .icon-btn.search-btn{ color:var(--c3); }

  .search-wrap{ padding:0 12px; max-height:0; overflow:hidden; transition:max-height .2s ease, padding .2s ease; }
  .search-wrap.open{ padding:8px 12px 4px; max-height:54px; }
  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--input); border:1px solid var(--rule); border-radius:20px;
    padding:7px 12px; color:var(--c3);
  }
  .search input{
    border:none; outline:none; background:transparent; font-family:var(--sans);
    font-size:13px; color:var(--ink); width:100%;
  }
  .search input::placeholder{ color:#6C6699; }

  /* Scroll area */
  .scroll{
    flex:1; overflow-y:auto; padding:8px 12px 84px;
    -webkit-overflow-scrolling:touch;
  }

  .summary-card{
    background:linear-gradient(120deg, var(--c1), var(--c2)); color:#fff; border-radius:14px;
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:baseline; justify-content:space-between;
    box-shadow:0 8px 20px rgba(124,92,255,0.25);
  }
  .summary-num{ font-family:var(--mono); font-size:28px; font-weight:600; letter-spacing:-0.02em; }
  .summary-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.75); }

  .row{
    background:var(--steel);
    border-radius:12px;
    padding:9px 9px;
    display:flex; align-items:center; gap:5px;
    margin-bottom:6px;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
    position:relative;
    border-left:3px solid transparent;
  }
  .row:active{ background:var(--steel-press); transform:scale(0.99); }
  .row.dragging{ box-shadow:0 14px 28px rgba(0,0,0,0.4); background:#fff; }
  .row-icon{
    width:28px; height:28px; flex:0 0 28px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; background:linear-gradient(135deg, var(--c1), var(--c2));
  }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dark-text); }
  .row-sub{ font-size:11px; color:#8A85A8; margin-top:1px; }
  .pill{
    font-family:var(--mono); font-size:11px; font-weight:700;
    background:var(--amber-tint); color:#8A5A16; border:1px solid #E9CE9B;
    padding:3px 8px; border-radius:20px; white-space:nowrap; flex:0 0 auto;
  }
  .chev{ color:#C4C0E0; flex:0 0 auto; }
  .drag-handle{
    width:20px; flex:0 0 20px; display:flex; align-items:center; justify-content:center;
    color:#C4C0E0; cursor:grab; touch-action:none; margin-left:-4px;
  }
  .drag-handle:active{ cursor:grabbing; color:var(--dark-text); }
  .drag-placeholder{
    border:2px dashed rgba(255,255,255,0.25); border-radius:12px; margin-bottom:10px; background:transparent;
  }
  .edit-btn, .del-btn{
    width:26px; height:26px; flex:0 0 26px; border:none; background:transparent;
    color:#B9B4DA; border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .edit-btn:active{ background:#00000010; color:#B8860B; }
  .del-btn:active{ background:#00000010; color:var(--danger); }

  /* Colorful row accents, cycled */
  .row.c1 .row-icon{ background:linear-gradient(135deg, var(--c1), #A78BFA); } .row.c1{ border-left-color:var(--c1); }
  .row.c2 .row-icon{ background:linear-gradient(135deg, var(--c2), #FF8FC4); } .row.c2{ border-left-color:var(--c2); }
  .row.c3 .row-icon{ background:linear-gradient(135deg, var(--c3), #6EE9E1); } .row.c3{ border-left-color:var(--c3); }
  .row.c4 .row-icon{ background:linear-gradient(135deg, var(--c4), #FFC178); } .row.c4{ border-left-color:var(--c4); }
  .row.c5 .row-icon{ background:linear-gradient(135deg, var(--c5), #7EE8B2); } .row.c5{ border-left-color:var(--c5); }
  .row.c6 .row-icon{ background:linear-gradient(135deg, var(--c6), #9BB8FF); } .row.c6{ border-left-color:var(--c6); }

  .row.row-total{
    background:linear-gradient(120deg, #1B1438, #2A1E5C);
    border-left:3px solid var(--amber);
    cursor:default;
  }
  .row.row-total:active{ transform:none; background:linear-gradient(120deg, #1B1438, #2A1E5C); }
  .row.row-total .row-icon{ background:linear-gradient(135deg, var(--amber), #FFD98A); color:#171233; }
  .row.row-total .row-title{ color:#fff; font-size:12.5px; letter-spacing:0.03em; }
  .row.row-total .row-sub{ color:#B9B4DA; }
  .row.row-total .pill{ background:var(--amber); color:#171233; border-color:var(--amber); font-size:12px; }

  .entry-card{
    background:var(--steel); border-radius:12px; padding:9px; margin-bottom:7px;
    display:flex; align-items:flex-start; gap:2px;
  }
  .entry-date{ font-family:var(--mono); font-size:11px; color:#8A85A8; letter-spacing:0.02em; }
  .entry-remark{ font-size:14px; margin-top:3px; line-height:1.32; word-break:break-word; color:var(--dark-text); }

  .empty{
    text-align:center; padding:44px 20px; color:var(--dim);
  }
  .empty-icon{ font-size:32px; margin-bottom:8px; opacity:.7; }
  .empty-title{ font-weight:600; color:var(--ink); font-size:14px; margin-bottom:4px; }
  .empty-sub{ font-size:12px; }

  /* FAB */
  .fab{
    position:absolute; right:14px; bottom:78px; width:50px; height:50px; border-radius:16px;
    background:linear-gradient(135deg, var(--c1), var(--c2)); color:#fff; border:none; box-shadow:0 8px 20px rgba(124,92,255,0.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;
  }
  .fab:active{ transform:scale(0.94); }

  /* Sheet */
  .overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:30;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--card); color:var(--ink);
    border-radius:22px 22px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); z-index:31;
    transform:translateY(105%); transition:transform .25s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 -10px 30px rgba(0,0,0,0.4);
    max-height:88vh; max-height:88dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet > *{ flex-shrink:0; }
  .sheet-handle{ width:38px; height:4px; background:#34363F; border-radius:3px; margin:6px auto 14px; }
  .sheet-title{ font-size:16px; font-weight:700; margin-bottom:12px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .field input, .field textarea, .field select{
    width:100%; border:1px solid var(--rule); border-radius:11px; padding:11px 12px;
    font-family:var(--sans); font-size:15px; background:var(--input); color:var(--ink); outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--c3); }
  .field input.mono{ font-family:var(--mono); }
  .field textarea{ resize:none; min-height:60px; font-family:var(--sans); }
  .field select{ -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239A9DA8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px; padding-right:36px;
  }
  .sheet-actions{ display:flex; gap:6px; margin-top:4px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:12px; font-family:var(--sans);
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn-primary{ background:linear-gradient(120deg, var(--c1), var(--c2)); color:#fff; }
  .btn-primary:active{ opacity:0.85; }
  .btn-ghost{ background:#262A4A; color:var(--ink); }
  .btn-ghost:active{ background:#31335A; }

  .toast{
    position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(10px);
    background:var(--card); color:var(--ink); padding:10px 18px; border-radius:30px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:50; white-space:nowrap;
    border:1px solid var(--rule);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ display:none; }
</style>

<style id="dashboard-enhancement-css">
  /* ===== Dashboard / Sidebar enhancement ===== */
  .app-layout{display:flex;flex:1;min-height:0;overflow:hidden;}
  .sidebar{
    width:220px;flex:0 0 220px;background:rgba(16,12,34,.94);
    border-right:1px solid var(--rule);padding:14px 10px;display:flex;
    flex-direction:column;gap:7px;overflow-y:auto;
  }
  .sidebar-brand{
    padding:8px 10px 14px;font-size:12px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  }
  .side-nav-btn{
    width:100%;border:1px solid transparent;background:transparent;color:var(--dim);
    border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:10px;
    font-family:var(--sans);font-size:13px;font-weight:600;text-align:left;cursor:pointer;
    transition:.15s ease;
  }
  .side-nav-btn:hover{background:#1B1438;color:var(--ink);}
  .side-nav-btn.active{
    background:linear-gradient(100deg,rgba(124,92,255,.28),rgba(255,93,162,.16));
    border-color:rgba(124,92,255,.45);color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.18);
  }
  .side-nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:0 0 18px;}
  .sidebar-spacer{flex:1;}
  .dashboard-main{min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .dashboard-scroll{flex:1;overflow-y:auto;padding:18px 22px 30px;-webkit-overflow-scrolling:touch;}
  .dashboard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .dashboard-kicker{font-size:11px;color:var(--c3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .dashboard-title{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:3px;}
  .dashboard-subtitle{font-size:12px;color:var(--dim);margin-top:4px;}
  .dashboard-total-card{
    min-width:145px;background:linear-gradient(120deg,var(--c1),var(--c2));
    border-radius:15px;padding:12px 15px;box-shadow:0 8px 22px rgba(124,92,255,.22);
  }
  .dashboard-total-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.75);}
  .dashboard-total-num{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:2px;}
  .stage-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px;}
  .stage-card{
    border:1px solid var(--rule);background:linear-gradient(145deg,#211A42,#181230);
    border-radius:13px;padding:11px 12px;cursor:pointer;min-width:0;
    transition:transform .12s ease,border-color .12s ease,background .12s ease;
  }
  .stage-card:hover{transform:translateY(-1px);border-color:#5947A0;background:#251D4A;}
  .stage-card:active{transform:scale(.99);}
  .stage-card-name{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stage-card-qty{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:6px;color:#fff;}
  .stage-card-unit{font-size:10px;color:var(--dim);margin-left:2px;}
  .chart-panel{
    background:rgba(23,15,48,.9);border:1px solid var(--rule);border-radius:16px;padding:15px 16px 17px;
  }
  .chart-title{font-size:14px;font-weight:700;margin-bottom:4px;}
  .chart-help{font-size:11px;color:var(--dim);margin-bottom:15px;}
  .stage-bars{display:flex;flex-direction:column;gap:9px;}
  .stage-bar-row{display:grid;grid-template-columns:145px minmax(0,1fr) 65px;align-items:center;gap:10px;cursor:pointer;}
  .stage-bar-label{font-size:11px;color:#EDEAFF;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stage-bar-track{height:22px;background:#120D28;border:1px solid #2A2050;border-radius:7px;overflow:hidden;}
  .stage-bar-fill{
    height:100%;min-width:0;border-radius:6px;
    background:linear-gradient(90deg,var(--c1),var(--c2));
    transition:width .35s ease;
  }
  .stage-bar-value{font-family:var(--mono);font-size:11px;font-weight:700;text-align:right;color:#fff;white-space:nowrap;}
  .dashboard-empty{padding:55px 20px;text-align:center;color:var(--dim);}
  .dashboard-empty strong{display:block;color:#fff;margin-bottom:5px;}
  .dashboard-modal{
    position:absolute;inset:0;background:rgba(5,3,15,.72);z-index:80;display:none;
    align-items:center;justify-content:center;padding:18px;
  }
  .dashboard-modal.open{display:flex;}
  .dashboard-modal-card{
    width:min(720px,100%);max-height:min(82vh,720px);overflow:hidden;
    background:#17102F;border:1px solid #3B2C70;border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;
  }
  .dashboard-modal-head{padding:15px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;}
  .dashboard-modal-title{flex:1;font-size:16px;font-weight:700;}
  .dashboard-modal-total{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--c3);}
  .dashboard-modal-close{width:31px;height:31px;border:0;border-radius:9px;background:#241B48;color:#fff;cursor:pointer;font-size:18px;}
  .dashboard-modal-body{overflow:auto;padding:12px 14px 16px;}
  .drill-row{
    display:flex;align-items:center;gap:10px;background:#211A42;border:1px solid #2D2354;
    border-radius:11px;padding:10px 11px;margin-bottom:7px;cursor:pointer;
  }
  .drill-row:hover{border-color:#5947A0;background:#261E4D;}
  .drill-product{font-family:var(--mono);font-size:12px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drill-qty{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
  .drill-arrow{color:#8E85C0;display:flex;}
  .drill-total{display:flex;justify-content:space-between;padding:12px 11px;margin-top:4px;border-radius:11px;background:#2A2050;color:#fff;font-weight:700;}
  @media (max-width:1100px){
    .stage-cards{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width:899px){
    #shell{max-width:none;}
    .app-layout{display:block;overflow:hidden;}
    .sidebar{
      position:absolute;left:0;top:0;bottom:0;width:225px;z-index:60;
      transform:translateX(-105%);transition:transform .22s ease;
      box-shadow:16px 0 40px rgba(0,0,0,.45);
    }
    .sidebar.open{transform:translateX(0);}
    .dashboard-main{height:100%;}
    .dashboard-scroll{padding:13px 12px 84px;}
    .dashboard-head{align-items:flex-start;flex-direction:column;}
    .dashboard-total-card{width:100%;min-width:0;}
    .stage-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .stage-bar-row{grid-template-columns:105px minmax(0,1fr) 56px;gap:7px;}
    .stage-bar-label{font-size:10px;}
  }
  @media (min-width:900px){
    .app-layout > .dashboard-main > .appbar{border-bottom:1px solid var(--rule);}
    .app-layout > .dashboard-main > .scroll{max-width:none;}
  }
  .side-toggle{
    display:none;width:30px;height:30px;border:0;border-radius:9px;background:var(--card);
    color:var(--ink);cursor:pointer;align-items:center;justify-content:center;flex:0 0 30px;
  }
  @media (max-width:899px){.side-toggle{display:flex;}}

  .wip-tabs{display:flex;gap:7px;margin-bottom:14px;padding:4px;background:#17102F;border:1px solid var(--rule);border-radius:12px;}
  .wip-tab{flex:1;border:0;background:transparent;color:var(--dim);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;}
  .wip-tab.active{background:linear-gradient(100deg,rgba(124,92,255,.3),rgba(255,93,162,.18));color:#fff;border:1px solid rgba(124,92,255,.45);}
  .excel-panel{background:#17102F;border:1px solid var(--rule);border-radius:15px;padding:12px;overflow:hidden;}

<script>
(function(){
  // ===== USER ID + PASSWORD AUTHENTICATION =====
  const AUTH_DOC = db.collection('appAuth').doc('users');
  const REQUESTS_DOC = db.collection('appAuth').doc('resetRequests');
  const OWNER_ID = 'owner';
  const DEFAULT_OWNER_PASSWORD = 'ChangeMe@2026';
  let currentUser = null;
  let authUsers = {};
  let resetRequests = {};

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadRequestsOnce(){
    try{
      const snap = await REQUESTS_DOC.get();
      resetRequests = snap.exists ? (snap.data().requests || {}) : {};
    }catch(e){ console.error(e); resetRequests = {}; }
  }

  function pendingCount(){
    return Object.values(resetRequests).filter(r=>r && r.status==='pending').length;
  }

  function renderResetRequestsList(){
    const list = document.getElementById('resetRequestsList');
    if(!list) return;
    const pending = Object.entries(resetRequests).filter(([id,r])=>r && r.status==='pending');
    if(pending.length===0){
      list.innerHTML = '<div id="noRequests">No pending requests</div>';
      return;
    }
    list.innerHTML = pending.map(([reqId,r])=>`
      <div class="reset-req-row">
        <div class="rr-top"><span>${esc(r.userId)}</span><span class="rr-type">${r.type==='forgot'?'Forgot password':'Change request'}</span></div>
        <div class="rr-sub">Requested ${new Date(r.requestedAt).toLocaleString()}</div>
        <div class="rr-note">Requested new password: <strong>${esc(r.newPassword)}</strong></div>
        <div class="rr-actions">
          <button type="button" class="rr-set" data-approve="${reqId}">Approve</button>
          <button type="button" class="rr-dismiss" data-reject="${reqId}">Reject</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-approve]').forEach(btn=>{
      btn.onclick = async ()=>{
        const reqId = btn.dataset.approve;
        const r = resetRequests[reqId];
        if(!authUsers[r.userId]){ ownerMessage('User no longer exists'); return; }
        try{
          authUsers[r.userId].password = r.newPassword;
          resetRequests[reqId].status='resolved';
          resetRequests[reqId].resolvedAt=new Date().toISOString();
          await AUTH_DOC.set({users:authUsers});
          await REQUESTS_DOC.set({requests:resetRequests});
          ownerMessage('Password updated for '+r.userId, true);
          renderResetRequestsList();
          renderUsersList();
        }catch(e){
          console.error(e);
          ownerMessage('Could not update. Check connection.');
        }
      };
    });
    list.querySelectorAll('[data-reject]').forEach(btn=>{
      btn.onclick = async ()=>{
        const reqId = btn.dataset.reject;
        try{
          resetRequests[reqId].status='rejected';
          await REQUESTS_DOC.set({requests:resetRequests});
          renderResetRequestsList();
        }catch(e){ console.error(e); }
      };
    });
  }

  function renderUsersList(){
    const list = document.getElementById('allUsersList');
    if(!list) return;
    const entries = Object.entries(authUsers).filter(([id])=>id!==OWNER_ID);
    if(entries.length===0){
      list.innerHTML = '<div id="noUsers">No users created yet</div>';
      return;
    }
    list.innerHTML = entries.map(([id,u])=>`
      <div class="user-row">
        <div>
          <div class="ur-id">${esc(id)}</div>
          <div class="ur-pw">Password: ${esc(u.password)}</div>
        </div>
        <span class="ur-status ${u.active?'':'inactive'}">${u.active?'Active':'Inactive'}</span>
        <button type="button" class="ur-access ${u.access==='read'?'read':''}" data-toggleaccess="${esc(id)}" title="Tap to toggle access">${u.access==='read'?'Read':'Write'}</button>
        <button type="button" class="ur-del" data-deluser="${esc(id)}" title="Delete user">${icon('trash')}</button>
      </div>
    `).join('');
    list.querySelectorAll('[data-toggleaccess]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.toggleaccess;
        const u = authUsers[id];
        if(!u) return;
        u.access = (u.access==='read') ? 'write' : 'read';
        try{
          await AUTH_DOC.set({users:authUsers});
          ownerMessage(`${id} is now ${u.access==='read'?'read-only':'write'} access`, true);
          renderUsersList();
        }catch(e){
          console.error(e);
          ownerMessage('Could not update access. Check connection.');
        }
      };
    });
    list.querySelectorAll('[data-deluser]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.deluser;
        if(!window.confirm('Delete user "'+id+'"? They will no longer be able to log in.')) return;
        try{
          delete authUsers[id];
          await AUTH_DOC.set({users:authUsers});
          ownerMessage('User "'+id+'" deleted', true);
          renderUsersList();
        }catch(e){
          console.error(e);
          ownerMessage('Could not delete user. Check connection.');
        }
      };
    });
  }

  function icon(name){
    if(name==='trash') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    return '';
  }

  function authEmail(id){
    return String(id || '').trim().toLowerCase() + '@econwip.local';
  }

  function authMessage(msg, ok=false){
    const el=document.getElementById('authMsg');
    if(el){ el.textContent=msg; el.style.color=ok?'#4CAF6D':'#D0564A'; }
  }

  function ownerMessage(msg, ok=false){
    const el=document.getElementById('ownerMsg');
    if(el){ el.textContent=msg; el.style.color=ok?'#4CAF6D':'#D0564A'; }
  }

  async function loadUsers(){
    const snap=await AUTH_DOC.get();
    if(snap.exists){
      authUsers=snap.data().users || {};
      // Migration: older versions of this app stored a hashed password
      // (field passwordHash) instead of plain "password". Any account still
      // missing a "password" field is repaired here so logins keep working.
      let needsSave=false;
      if(!authUsers[OWNER_ID]){
        authUsers[OWNER_ID]={ password:DEFAULT_OWNER_PASSWORD, role:'owner', active:true, createdAt:new Date().toISOString() };
        needsSave=true;
      } else if(!authUsers[OWNER_ID].password){
        authUsers[OWNER_ID].password=DEFAULT_OWNER_PASSWORD;
        needsSave=true;
      }
      Object.keys(authUsers).forEach(id=>{
        if(id===OWNER_ID) return;
        if(!authUsers[id].password){
          authUsers[id].password='ResetMe@123';
          needsSave=true;
        }
        if(authUsers[id].access!=='read' && authUsers[id].access!=='write'){
          authUsers[id].access='write';
          needsSave=true;
        }
      });
      if(needsSave){ await AUTH_DOC.set({users:authUsers}); }
      return;
    }
    authUsers={
      [OWNER_ID]:{
        password:DEFAULT_OWNER_PASSWORD,
        role:'owner',
        active:true,
        createdAt:new Date().toISOString()
      }
    };
    await AUTH_DOC.set({users:authUsers});
  }

  function showLogin(){
    document.getElementById('shell').style.display='none';
    document.getElementById('authScreen').style.display='flex';
  }

  function showApp(user){
    currentUser=user;
    document.getElementById('authScreen').style.display='none';
    document.getElementById('shell').style.display='flex';
  }

  async function login(){
    const id=document.getElementById('loginId').value.trim();
    const pw=document.getElementById('loginPassword').value;
    if(!id || !pw){ authMessage('Enter User ID and password'); return; }

    const u=authUsers[id];
    if(!u || !u.active){ authMessage('Invalid User ID or password'); return; }

    if(pw!==u.password){ authMessage('Invalid User ID or password'); return; }

    currentUser={id, role:u.role, access:u.access || 'write'};
    showApp(currentUser);
    startWipApp(currentUser);
  }

  document.getElementById('loginBtn').onclick=login;
  document.getElementById('loginPassword').addEventListener('keydown',e=>{
    if(e.key==='Enter') login();
  });

  window.openOwnerPanel=()=>{
    if(!currentUser || currentUser.role!=='owner') return;
    document.getElementById('ownerPanel').classList.add('open');
    ownerMessage('');
    renderUsersList();
    renderResetRequestsList();
  };

  document.getElementById('closeOwnerBtn').onclick=()=>{
    document.getElementById('ownerPanel').classList.remove('open');
  };

  document.getElementById('changeOwnerPwBtn').onclick=async()=>{
    if(!currentUser || currentUser.role!=='owner') return;
    const msgEl=document.getElementById('ownerPwMsg');
    const curPw=document.getElementById('ownerCurPw').value;
    const newPw=document.getElementById('ownerNewPw').value;
    msgEl.style.color='#D0564A';
    if(!curPw || !newPw){ msgEl.textContent='Enter current and new password'; return; }
    if(curPw!==authUsers[OWNER_ID].password){ msgEl.textContent='Current password is wrong'; return; }
    if(newPw.length<6){ msgEl.textContent='New password must be at least 6 characters'; return; }
    try{
      authUsers[OWNER_ID].password=newPw;
      await AUTH_DOC.set({users:authUsers});
      msgEl.style.color='#4CAF6D';
      msgEl.textContent='Owner password changed successfully';
      document.getElementById('ownerCurPw').value='';
      document.getElementById('ownerNewPw').value='';
    }catch(e){
      console.error(e);
      msgEl.style.color='#D0564A';
      msgEl.textContent='Could not update. Check connection.';
    }
  };


  document.getElementById('createUserBtn').onclick=async()=>{
    if(!currentUser || currentUser.role!=='owner') return;

    const id=document.getElementById('newUserId').value.trim();
    const pw=document.getElementById('newUserPassword').value;
    const accessSel=document.getElementById('newUserAccess');
    const access=(accessSel && accessSel.value==='read') ? 'read' : 'write';

    if(!/^[A-Za-z0-9._-]{3,30}$/.test(id)){
      ownerMessage('User ID: 3-30 letters, numbers, dot, _ or -');
      return;
    }
    if(id.toLowerCase()===OWNER_ID){
      ownerMessage('OWNER ID is reserved');
      return;
    }
    if(pw.length<6){
      ownerMessage('Password must be at least 6 characters');
      return;
    }
    if(authUsers[id]){
      ownerMessage('User ID already exists');
      return;
    }

    authUsers[id]={
      password:pw,
      role:'user',
      access:access,
      active:true,
      createdAt:new Date().toISOString(),
      createdBy:OWNER_ID
    };

    try{
      await AUTH_DOC.set({users:authUsers});
      document.getElementById('newUserId').value='';
      document.getElementById('newUserPassword').value='';
      if(accessSel) accessSel.value='write';
      ownerMessage('User created successfully',true);
      renderUsersList();
    }catch(e){
      console.error(e);
      ownerMessage('Could not save user. Check Firestore rules.');
    }
  };

  // Compatibility helpers used by the existing tracker UI.
  window.auth={
    signOut:()=>{
      location.reload();
    }
  };

  window.__auth={
    isOwner:()=> !!currentUser && currentUser.role==='owner',
    canWrite:()=> !!currentUser && (currentUser.role==='owner' || currentUser.access==='write'),
    logout:()=> auth.signOut(),
    showOwnerPanel:()=> window.openOwnerPanel(),
    openChangePasswordRequest:()=>{
      if(!currentUser) return;
      const sheet = document.getElementById('sheet');
      const overlay = document.getElementById('overlay');
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-title">Request password change</div>
        <div class="field">
          <label>New password</label>
          <input type="password" id="cpNewPw" placeholder="Minimum 6 characters">
        </div>
        <div class="field">
          <label>Confirm new password</label>
          <input type="password" id="cpNewPw2" placeholder="Re-enter new password">
        </div>
        <div class="sheet-actions">
          <button class="btn btn-ghost" id="cpCancel">Cancel</button>
          <button class="btn btn-primary" id="cpSend">Send request</button>
        </div>
      `;
      overlay.classList.add('open');
      requestAnimationFrame(()=>sheet.classList.add('open'));
      const closeIt=()=>{ sheet.classList.remove('open'); overlay.classList.remove('open'); };
      document.getElementById('cpCancel').onclick = closeIt;
      document.getElementById('cpSend').onclick = async ()=>{
        const pw1 = document.getElementById('cpNewPw').value;
        const pw2 = document.getElementById('cpNewPw2').value;
        const toast = document.getElementById('toast');
        if(pw1.length<6){ alert('New password must be at least 6 characters'); return; }
        if(pw1!==pw2){ alert('Passwords do not match'); return; }
        try{
          const snap = await REQUESTS_DOC.get();
          const requests = snap.exists ? (snap.data().requests||{}) : {};
          const reqId = 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          requests[reqId] = { userId: currentUser.id, requestedAt:new Date().toISOString(), status:'pending', type:'change', newPassword:pw1 };
          await REQUESTS_DOC.set({requests});
          closeIt();
          if(toast){ toast.textContent='Request sent to owner for approval'; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); }
        }catch(e){
          console.error(e);
          alert('Could not send request. Check connection and try again.');
        }
      };
    }
  };

  function startWipApp(user){
  let state = null;
  let syncStatus = 'connecting'; // connecting | on | err
  let nav = [{ view:'dashboard' }]; // stack of {view, productId, stageId}
  let searchTerm = '';
  let searchOpen = false;
  const canWrite = user.role==='owner' || user.access==='write';

  // ---------- Back-button handling ----------
  // Every time we go one level deeper (products -> stages -> entries) we push
  // a history entry. The mobile/hardware back button then triggers a
  // popstate event that we intercept to pop just one level of our own nav
  // stack instead of letting the browser navigate away from the app.
  function goTo(navState){
    nav.push(navState);
    try{ history.pushState({ wipNavDepth: nav.length }, ''); }catch(e){}
    render();
  }
  function goBack(){
    if(nav.length>1){ history.back(); }
  }
  window.addEventListener('popstate', ()=>{
    if(nav.length>1){
      nav.pop();
      render();
    }
  });

  // ---------- Desktop keyboard shortcuts ----------
  // Esc  -> close an open Add/Edit sheet, otherwise go back one level (any page)
  // Enter-> save the currently open sheet (ignored while typing in a textarea, so remarks can wrap lines)
  // +    -> trigger the current page's Add ("+") button, when not typing in a field
  document.addEventListener('keydown', (e)=>{
    const overlayEl = document.getElementById('overlay');
    const sheetOpen = !!overlayEl && overlayEl.classList.contains('open');
    const active = document.activeElement;
    const isTypingField = !!active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT');

    if(e.key==='Escape'){
      e.preventDefault();
      if(sheetOpen){ closeSheet(); return; }
      const dashboardModal = document.getElementById('dashboardModal');
      if(dashboardModal && dashboardModal.classList.contains('open')){ closeDashboardModal(); return; }
      const ownerPanel = document.getElementById('ownerPanel');
      if(ownerPanel && ownerPanel.classList.contains('open')){ ownerPanel.classList.remove('open'); return; }
      if(nav.length>1){ goBack(); }
      return;
    }

    if(e.key==='Enter'){
      if(sheetOpen && !(active && active.tagName==='TEXTAREA')){
        const saveBtn = document.getElementById('saveBtn');
        if(saveBtn){ e.preventDefault(); saveBtn.click(); }
      }
      return;
    }

    if(e.key==='+'){
      if(isTypingField || sheetOpen) return;
      const fab = document.getElementById('fab');
      if(fab && fab.style.display!=='none'){ e.preventDefault(); fab.click(); }
    }
  });

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // ---------- Fixed stage list (used for stage picker + Excel export columns) ----------
  const STAGE_COLUMNS = [
    'KIT QTY','INCOMMING','SHIPPED','PACKING','OQA','LOG','FQC','TESTING2','TESTING1',
    'MERGING','SENSOR CLEANING','PROGRAM','FAIL','REWORK','DEBUG','RW IN DEBUG',
    'SENSOR ISSUE','SCRAP'
  ];
  const OTHERS_KEY = 'OTHERS';
  const OTHERS_LABEL = 'OTHERS(MANUAL ENTRY)';
  const TOTAL_LABEL = 'TOTAL(SUM OF SHIPPED:OTHERS)';
  // Columns included in the TOTAL sum: everything from SHIPPED through OTHERS (i.e. excludes KIT QTY & INCOMMING)
  const TOTAL_COLUMNS = STAGE_COLUMNS.slice(2).concat([OTHERS_KEY]);

  function resolveStageKey(stage){
    if(stage.stageKey) return stage.stageKey;
    const norm = String(stage.name||'').trim().toUpperCase();
    return STAGE_COLUMNS.includes(norm) ? norm : OTHERS_KEY;
  }

  function seed(){
    const now = new Date().toISOString();
    return {
      products:[
        { id:uid(), code:'A897-064-3206-00', stages:[], createdAt:now, updatedAt:now },
        { id:uid(), code:'A897-064-3207-00', stages:[], createdAt:now, updatedAt:now },
        { id:uid(), code:'A897-064-3208-00', stages:[], createdAt:now, updatedAt:now }
      ]
    };
  }

  // ---------- Firestore sync (shared, multi-user) ----------
  function subscribeState(){
    stateDocRef.onSnapshot(async (docSnap)=>{
      if(docSnap.exists){
        state = docSnap.data();
        syncStatus = 'on';
        render();
      } else {
        state = seed();
        try{ await stateDocRef.set(state); syncStatus='on'; }
        catch(e){ syncStatus='err'; console.error(e); }
        render();
      }
    }, (err)=>{
      console.error('Firestore sync error', err);
      syncStatus = 'err';
      showToast('Sync error — check Firebase config / rules');
      render();
    });
  }

  async function saveState(){
    try{ await stateDocRef.set(state); }
    catch(e){
      console.error('Save failed', e);
      showToast('Save failed — check connection');
    }
  }

  function currentNav(){ return nav[nav.length-1]; }

  function findProduct(id){ return state.products.find(p=>p.id===id); }
  function findStage(productId, stageId){
    const p = findProduct(productId);
    return p ? p.stages.find(s=>s.id===stageId) : null;
  }
  function stageQty(stage){ return stage.entries.reduce((sum,e)=>sum+Number(e.qty||0),0); }
  function productQty(product){ return product.stages.reduce((sum,s)=>sum+stageQty(s),0); }
  // TOTAL = sum of all stages EXCEPT "KIT QTY" and "INCOMMING" (matches TOTAL_COLUMNS used in export)
  function productTotalQty(product){
    return product.stages.reduce((sum,s)=> TOTAL_COLUMNS.includes(resolveStageKey(s)) ? sum+stageQty(s) : sum, 0);
  }

  // ---------- Dashboard ----------
  const DASHBOARD_CATEGORIES = [
    { key:'done', name:'Process Done', stages:['PACKING','OQA','LOG'], cls:'done' },
    { key:'process', name:'Under Process', stages:['FQC','TESTING2','TESTING1','MERGING','SENSOR CLEANING','PROGRAM'], cls:'process' },
    { key:'fail', name:'Failures', stages:['FAIL','REWORK','DEBUG','RW IN DEBUG','SENSOR ISSUE','SCRAP'], cls:'fail' },
    { key:'other', name:'Others', stages:[OTHERS_KEY], cls:'other' }
  ];

  function getDashboardCategoryData(){
    const stageData = {};
    [...STAGE_COLUMNS, OTHERS_KEY].forEach(key=>stageData[key]=[]);
    (state.products || []).forEach(product=>{
      (product.stages || []).forEach(stage=>{
        const key = resolveStageKey(stage);
        const qty = stageQty(stage);
        if(qty <= 0) return;
        const existing = stageData[key].find(x=>x.productId===product.id);
        if(existing) existing.qty += qty;
        else stageData[key].push({productId:product.id, code:product.code, qty});
      });
    });
    const categories = DASHBOARD_CATEGORIES.map(cat=>{
      const itemsByProduct = {};
      cat.stages.forEach(stageKey=>{
        (stageData[stageKey] || []).forEach(item=>{
          if(!itemsByProduct[item.productId]) itemsByProduct[item.productId]={productId:item.productId,code:item.code,qty:0};
          itemsByProduct[item.productId].qty += item.qty;
        });
      });
      const items = Object.values(itemsByProduct).sort((a,b)=>b.qty-a.qty);
      return {...cat, items, total:items.reduce((sum,x)=>sum+x.qty,0)};
    });
    const grandTotal = categories.reduce((sum,x)=>sum+x.total,0);
    categories.forEach(cat=>cat.pct = grandTotal ? (cat.total/grandTotal)*100 : 0);
    return {categories, grandTotal};
  }

  function closeDashboardModal(){
    const modal = document.getElementById('dashboardModal');
    if(modal) modal.classList.remove('open');
  }

  // Overall stage chart: exclude KIT QTY and SHIPPED.
  // INCOMMING is intentionally retained because the latest dashboard requirement
  // only excludes KIT QTY and SHIPPED from this section.
  const OVERALL_STAGE_KEYS = STAGE_COLUMNS.filter(key=>key!=='KIT QTY' && key!=='INCOMMING' && key!=='SHIPPED').concat([OTHERS_KEY]);

  function getOverallStageData(){
    const data = {};
    OVERALL_STAGE_KEYS.forEach(key=>data[key]=[]);
    (state.products || []).forEach(product=>{
      (product.stages || []).forEach(stage=>{
        const key = resolveStageKey(stage);
        if(!data[key]) return;
        const qty = stageQty(stage);
        if(qty <= 0) return;
        const existing = data[key].find(x=>x.productId===product.id);
        if(existing) existing.qty += qty;
        else data[key].push({productId:product.id, code:product.code, qty});
      });
    });
    OVERALL_STAGE_KEYS.forEach(key=>data[key].sort((a,b)=>b.qty-a.qty));
    return data;
  }

  function openDashboardStage(stageKey){
    const data = getOverallStageData();
    const items = data[stageKey] || [];
    const total = items.reduce((sum,x)=>sum+Number(x.qty||0),0);
    const modal = document.getElementById('dashboardModal');
    const title = document.getElementById('dashboardModalTitle');
    const totalEl = document.getElementById('dashboardModalTotal');
    const body = document.getElementById('dashboardModalBody');
    if(!modal || !title || !totalEl || !body) return;

    title.textContent = stageKey===OTHERS_KEY ? OTHERS_LABEL : stageKey;
    totalEl.textContent = `${total} B`;

    if(items.length===0){
      body.innerHTML = `<div class="dashboard-empty"><strong>No quantity in this stage</strong>Products with quantity 0 are hidden.</div>`;
    }else{
      body.innerHTML = items.map(item=>`
        <div class="drill-row" data-dashboard-product="${escapeAttr(item.productId)}">
          <div class="drill-product">${escapeHtml(item.code)}</div>
          <div class="drill-qty">${item.qty} B</div>
          <div class="drill-arrow">${icon('chev')}</div>
        </div>
      `).join('') + `<div class="drill-total"><span>TOTAL</span><span>${total} B</span></div>`;

      body.querySelectorAll('[data-dashboard-product]').forEach(row=>{
        row.onclick=()=>{
          const productId=row.dataset.dashboardProduct;
          closeDashboardModal();
          goTo({view:'stages',productId});
        };
      });
    }
    modal.classList.add('open');
  }


  function openDashboardCategory(categoryKey){
    const info = getDashboardCategoryData();
    const cat = info.categories.find(x=>x.key===categoryKey);
    if(!cat) return;
    const modal = document.getElementById('dashboardModal');
    const title = document.getElementById('dashboardModalTitle');
    const totalEl = document.getElementById('dashboardModalTotal');
    const body = document.getElementById('dashboardModalBody');
    if(!modal || !title || !totalEl || !body) return;
    title.textContent = cat.name;
    totalEl.textContent = `${cat.total} B • ${cat.pct.toFixed(0)}%`;
    if(cat.items.length===0){
      body.innerHTML = `<div class="dashboard-empty"><strong>No quantity in this category</strong>Products with quantity 0 are hidden.</div>`;
    }else{
      body.innerHTML = cat.items.map(item=>`
        <div class="drill-row" data-dashboard-product="${escapeAttr(item.productId)}">
          <div class="drill-product">${escapeHtml(item.code)}</div>
          <div class="drill-qty">${item.qty} B</div>
          <div class="drill-arrow">${icon('chev')}</div>
        </div>
      `).join('') + `<div class="drill-total"><span>TOTAL</span><span>${cat.total} B</span></div>`;
      body.querySelectorAll('[data-dashboard-product]').forEach(row=>{
        row.onclick=()=>{
          const productId=row.dataset.dashboardProduct;
          closeDashboardModal();
          goTo({view:'stages',productId});
        };
      });
    }
    modal.classList.add('open');
  }

  function renderDashboard(scroll){
    const info = getDashboardCategoryData();
    const categories = info.categories;
    const stageData = getOverallStageData();
    const stageTotals = OVERALL_STAGE_KEYS.map(key=>({
      key,
      total:(stageData[key] || []).reduce((sum,x)=>sum+Number(x.qty||0),0)
    }));
    const overallStageQty = stageTotals.reduce((sum,x)=>sum+x.total,0);
    const maxStageTotal = Math.max(1,...stageTotals.map(x=>x.total));
    const maxPct = Math.max(1,...categories.map(x=>x.pct));

    scroll.className='dashboard-scroll';
    scroll.innerHTML=`
      <div class="dashboard-head">
        <div>
          <div class="dashboard-kicker">Live WIP Overview</div>
          <div class="dashboard-title">Dashboard</div>
          <div class="dashboard-subtitle">Production status summary • category percentages exclude Kit Qty, Incomming and Shipped</div>
        </div>
        <div class="dashboard-total-card">
          <div class="dashboard-total-label">Dashboard Qty</div>
          <div class="dashboard-total-num">${info.grandTotal} B</div>
        </div>
      </div>

      <div class="chart-panel">
        <div class="chart-title">WIP Category Summary</div>
        <div class="chart-help">Process Done, Under Process, Failures and Others. Click a category to see the products included in it.</div>
        <div class="category-bars">
          ${categories.map(cat=>`
            <div class="category-bar-row" data-dashboard-category="${cat.key}">
              <div class="category-bar-label">${escapeHtml(cat.name)}</div>
              <div class="category-bar-track"><div class="category-bar-fill" style="width:${cat.pct>0?Math.max(2,(cat.pct/maxPct)*100):0}%"></div></div>
              <div class="category-bar-value">${cat.pct.toFixed(0)}%</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="chart-panel stage-summary-panel">
        <div class="chart-title">Overall Quantity by Stage</div>
        <div class="chart-help">KIT QTY, INCOMMING and SHIPPED are excluded from this list. Percentage is based on the total quantity shown in this stage section. Click a stage to view its products.</div>
        <div class="stage-bars">
          ${stageTotals.map(item=>{
            const width = item.total > 0 ? Math.max(2,(item.total/maxStageTotal)*100) : 0;
            return `
              <div class="stage-bar-row" data-dashboard-stage="${escapeAttr(item.key)}" title="Open ${escapeAttr(item.key===OTHERS_KEY?OTHERS_LABEL:item.key)} details">
                <div class="stage-bar-label">${escapeHtml(item.key===OTHERS_KEY?OTHERS_LABEL:item.key)}</div>
                <div class="stage-bar-track"><div class="stage-bar-fill" style="width:${width}%"></div></div>
                <div class="stage-bar-value">${item.total} B <span class="stage-bar-percent">${overallStageQty ? ((item.total/overallStageQty)*100).toFixed(0) : 0}%</span></div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    scroll.querySelectorAll('[data-dashboard-category]').forEach(el=>{
      el.onclick=()=>openDashboardCategory(el.dataset.dashboardCategory);
    });
    scroll.querySelectorAll('[data-dashboard-stage]').forEach(el=>{
      el.onclick=()=>openDashboardStage(el.dataset.dashboardStage);
    });
  }

  function setSideActive(view){
    document.querySelectorAll('[data-side-nav]').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.sideNav===view);
    });
  }

  function navigateSidebar(view){
    if(view==='dashboard'){
      nav = [{view:'dashboard'}];
      searchOpen = false; searchTerm = '';
      closeDashboardModal();
      render();
    }else if(view==='products'){
      nav = [{view:'products'}];
      searchOpen = false; searchTerm = '';
      closeDashboardModal();
      render();
    }else if(view==='reports'){
      nav = [{view:'reports'}];
      searchOpen = false; searchTerm = '';
      closeDashboardModal();
      render();
    }else{
      showToast('Analytics page coming next');
    }
    document.getElementById('sidebar')?.classList.remove('open');
  }

  function getCurrentArray(){
    const n = currentNav();
    if(n.view==='dashboard') return [];
    if(n.view==='products') return state.products;
    if(n.view==='stages'){ const p = findProduct(n.productId); return p ? p.stages : []; }
    if(n.view==='entries'){ const s = findStage(n.productId, n.stageId); return s ? s.entries : []; }
    return [];
  }

  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });
  }

  function todayISO(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime()-off*60000);
    return local.toISOString().slice(0,10);
  }

  function icon(name){
    if(name==='back') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  function confirmDelete(msg, onYes){
    if(window.confirm(msg)) onYes();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str==null? '' : String(str);
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str==null?'':str)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
  }

  // ---------- Sheets (Add / Edit share the same UI) ----------
  function openSheet(html){
    document.getElementById('sheet').innerHTML = html;
    document.getElementById('overlay').classList.add('open');
    requestAnimationFrame(()=>document.getElementById('sheet').classList.add('open'));
    const firstInput = document.querySelector('#sheet input, #sheet textarea');
    if(firstInput) setTimeout(()=>firstInput.focus(), 200);
  }
  function closeSheet(){
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');

  function openProductSheet(existing){
    if(!canWrite){ showToast('Read-only access'); return; }
    const isEdit = !!existing;
    openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">${isEdit ? 'Edit product' : 'Add product'}</div>
      <div class="field">
        <label>Product code</label>
        <input class="mono" id="inpCode" placeholder="e.g. A897-064-3209-00" value="${isEdit ? escapeAttr(existing.code) : ''}">
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">${isEdit ? 'Save changes' : 'Add product'}</button>
      </div>
    `);
    document.getElementById('cancelBtn').onclick = closeSheet;
    document.getElementById('saveBtn').onclick = ()=>{
      const code = document.getElementById('inpCode').value.trim();
      if(!code){ showToast('Enter a product code'); return; }
      const now = new Date().toISOString();
      if(isEdit){ existing.code = code; existing.updatedAt = now; showToast('Product updated'); }
      else { state.products.push({ id:uid(), code, stages:[], createdAt:now, updatedAt:now }); showToast('Product added'); }

      closeSheet();
      render();

  function openStageSheet(productId, existing){
    if(!canWrite){ showToast('Read-only access'); return; }
    const isEdit = !!existing;
    const currentKey = isEdit ? resolveStageKey(existing) : '';
    const isOthers = currentKey === OTHERS_KEY;
    const optionsHtml = STAGE_COLUMNS.map(c=>
      `<option value="${c}" ${(!isOthers && currentKey===c) ? 'selected':''}>${c}</option>`
    ).join('') + `<option value="${OTHERS_KEY}" ${isOthers?'selected':''}>${OTHERS_LABEL}</option>`;
    openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">${isEdit ? 'Edit stage' : 'Add stage'}</div>
      <div class="field">
        <label>Stage</label>
        <select id="inpStageSelect">
          <option value="" disabled ${currentKey?'':'selected'}>Select a stage</option>
          ${optionsHtml}
        </select>
      </div>
      <div class="field" id="othersField" style="display:${isOthers?'block':'none'};">
        <label>Custom stage name</label>

        <button class="btn btn-primary" id="saveBtn">${isEdit ? 'Save changes' : 'Add stage'}</button>

    document.getElementById('saveBtn').onclick = ()=>{

      if(!key){ showToast('Select a stage'); return; }
      let name;
      if(key===OTHERS_KEY){
        name = document.getElementById('inpStageOther').value.trim();
        if(!name){ showToast('Enter a custom stage name'); return; }
      } else {
        name = key;
      }
      if(isEdit){
        existing.name = name; existing.stageKey = key;
        showToast('Stage updated');
      } else {
        const p = findProduct(productId);
        p.stages.push({ id:uid(), name, stageKey:key, entries:[] });
        showToast('Stage added');
      }
      const pp = findProduct(productId);
      if(pp) pp.updatedAt = new Date().toISOString();
      saveState();
      closeSheet();
      render();
    };
  }

  // ---------- Excel export: consolidated sheet across all products ----------
  function sortedProducts(){
    return state.products.slice().sort((a,b)=>{
      const av = a.updatedAt || a.createdAt || '';
      const bv = b.updatedAt || b.createdAt || '';
      return bv.localeCompare(av); // most recently modified first
    });
  }

  async function exportConsolExcel(){
    if(!state || !state.products || state.products.length===0){ showToast('No products to export'); return; }
    if(typeof ExcelJS === 'undefined'){ showToast('Export library failed to load — check connection'); return; }
    showToast('Preparing export…');

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Consol');

    const CARDS_PER_ROW = 3;
    const LABEL_COL_W = 24;
    const VALUE_COL_W = 13;
    const GAP_COL_W = 3;
    const GROUP_GAP_ROWS = 1;

    const HEADER_FILL = 'FF3DD68C';
    const TOTAL_FILL  = 'FFEDEDED';
    const BORDER = { style:'thin', color:{ argb:'FFC9C9C9' } };
    const thinBorder = { top:BORDER, left:BORDER, bottom:BORDER, right:BORDER };

    // Set up column widths: [label, value, gap] x CARDS_PER_ROW (no trailing gap needed)
    const colWidths = [];
    for(let c=0;c<CARDS_PER_ROW;c++){
      colWidths.push(LABEL_COL_W, VALUE_COL_W);
      if(c < CARDS_PER_ROW-1) colWidths.push(GAP_COL_W);
    }
    colWidths.forEach((w,i)=>{ ws.getColumn(i+1).width = w; });

    const products = sortedProducts();
    let rowCursor = 1;

    for(let i=0; i<products.length; i+=CARDS_PER_ROW){
      const group = products.slice(i, i+CARDS_PER_ROW);
      let maxRowsInGroup = 0;

      group.forEach((p, idx)=>{
        const labelCol = idx*3 + 1;
        const valueCol = labelCol + 1;
        const headerRowNum = rowCursor;

        // Header (product code) — merged, green fill
        ws.mergeCells(headerRowNum, labelCol, headerRowNum, valueCol);
        const headerCell = ws.getCell(headerRowNum, labelCol);
        headerCell.value = p.code;
        headerCell.font = { bold:true, size:12, color:{ argb:'FF14231C' } };
        headerCell.alignment = { vertical:'middle', horizontal:'center' };
        headerCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:HEADER_FILL } };
        ws.getRow(headerRowNum).height = 22;
        [labelCol, valueCol].forEach(c=>{ ws.getCell(headerRowNum, c).border = thinBorder; });

        // Stage rows, in the product's own stage order
        p.stages.forEach((s, sIdx)=>{
          const r = headerRowNum + 1 + sIdx;
          const labelCell = ws.getCell(r, labelCol);
          const valueCell = ws.getCell(r, valueCol);
          labelCell.value = (s.name || '').toUpperCase();
          valueCell.value = stageQty(s);
          labelCell.font = { bold:true, size:10, color:{ argb:'FF1C1C1E' } };
          valueCell.font = { size:10, color:{ argb:'FF1C1C1E' } };
          labelCell.alignment = { vertical:'middle', horizontal:'left' };
          valueCell.alignment = { vertical:'middle', horizontal:'center' };
          labelCell.border = thinBorder;
          valueCell.border = thinBorder;
        });

        // TOTAL row
        const totalRowNum = headerRowNum + 1 + p.stages.length;
        const totalLabelCell = ws.getCell(totalRowNum, labelCol);
        const totalValueCell = ws.getCell(totalRowNum, valueCol);
        totalLabelCell.value = 'TOTAL';
        totalValueCell.value = productTotalQty(p);
        [totalLabelCell, totalValueCell].forEach(cell=>{
          cell.font = { bold:true, size:10, color:{ argb:'FF1C1C1E' } };
          cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:TOTAL_FILL } };
          cell.border = thinBorder;
        });
        totalLabelCell.alignment = { vertical:'middle', horizontal:'left' };
        totalValueCell.alignment = { vertical:'middle', horizontal:'center' };

        const cardRows = 1 + p.stages.length + 1; // header + stages + total
        if(cardRows > maxRowsInGroup) maxRowsInGroup = cardRows;
      });

      rowCursor += maxRowsInGroup + GROUP_GAP_ROWS;
    }

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ECON_WIP_Consol_${todayISO()}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Excel report exported');
  }

  // ---------- Excel export: flat table, one row per product, columns per stage ----------
  async function exportExcel(){
    if(!state || !state.products || state.products.length===0){ showToast('No products to export'); return; }
    if(typeof ExcelJS === 'undefined'){ showToast('Export library failed to load — check connection'); return; }
    showToast('Preparing export…');
    const headerLabels = ['PRODUCT', ...STAGE_COLUMNS, 'OTHERS', 'TOTAL', 'REMARKS'];
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Export', { views:[{ state:'frozen', xSplit:1, ySplit:1 }] });

    ws.addRow(headerLabels);
    const headerRow = ws.getRow(1);
    headerRow.height = 34;
    headerRow.eachCell(cell=>{
      cell.font = { bold:true, color:{ argb:'FF1C1C1E' } };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFBEDCEA' } };
      cell.border = {
        top:{style:'thin', color:{argb:'FFAAB6BE'}}, left:{style:'thin', color:{argb:'FFAAB6BE'}},
        bottom:{style:'thin', color:{argb:'FFAAB6BE'}}, right:{style:'thin', color:{argb:'FFAAB6BE'}}
      };
    });

    sortedProducts().forEach(p=>{
      const colSums = {};
      STAGE_COLUMNS.forEach(c=>{ colSums[c] = 0; });
      colSums[OTHERS_KEY] = 0;
      const othersBreakdown = [];
      p.stages.forEach(s=>{
        const key = resolveStageKey(s);
        const qty = stageQty(s);
        if(key===OTHERS_KEY){
          colSums[OTHERS_KEY] += qty;
          if(qty) othersBreakdown.push(`${qty}-${s.name}`);
        } else if(Object.prototype.hasOwnProperty.call(colSums, key)){
          colSums[key] += qty;
        } else {
          colSums[OTHERS_KEY] += qty;
          if(qty) othersBreakdown.push(`${qty}-${s.name}`);
        }
      });
      const total = TOTAL_COLUMNS.reduce((sum,c)=> sum + (colSums[c]||0), 0);
      const rowValues = [
        p.code,
        ...STAGE_COLUMNS.map(c => colSums[c] ? colSums[c] : null),
        colSums[OTHERS_KEY] ? colSums[OTHERS_KEY] : null,
        total ? total : null,
        othersBreakdown.join('\n')
      ];
      const row = ws.addRow(rowValues);
      const lineCount = othersBreakdown.length || 1;
      row.height = Math.max(18, lineCount * 15);
      row.eachCell((cell, colNumber)=>{
        const isProductCol = colNumber===1;
        const isRemarksCol = colNumber===headerLabels.length;
        cell.alignment = {
          vertical:'middle',
          horizontal: (isProductCol || isRemarksCol) ? 'left' : 'center',
          wrapText:true
        };
        cell.border = {
          top:{style:'thin', color:{argb:'FFDDDDDD'}}, left:{style:'thin', color:{argb:'FFDDDDDD'}},
          bottom:{style:'thin', color:{argb:'FFDDDDDD'}}, right:{style:'thin', color:{argb:'FFDDDDDD'}}
        };
        if(isProductCol) cell.font = { bold:true };
      });
    });

    ws.columns.forEach((col,i)=>{
      if(i===0) col.width = 20;
      else if(i===headerLabels.length-1) col.width = 34;
      else col.width = 13;
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ECON_WIP_Export_${todayISO()}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Excel report exported');
  }

  // ---------- Image export: single product's stage table as a PNG (matches the product detail screen) ----------
  function exportProductStageImage(product){
    if(!product || !product.stages || product.stages.length===0){ showToast('No stages to export'); return; }
    try{
      const SCALE = 2; // render at 2x for a crisp image
      const width = 380;
      const headerHeight = 42;
      const rowHeight = 38;
      const rowCount = product.stages.length + 1; // + TOTAL row
      const height = headerHeight + rowCount*rowHeight;
      const colSplit = Math.round(width*0.64);

      const canvas = document.createElement('canvas');
      canvas.width = width*SCALE;
      canvas.height = height*SCALE;
      const ctx = canvas.getContext('2d');
      ctx.scale(SCALE, SCALE);

      // background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,width,height);

      // header row — product code, light blue
      ctx.fillStyle = '#BEDCEA';
      ctx.fillRect(0,0,width,headerHeight);
      ctx.fillStyle = '#1C1C1E';
      ctx.font = 'bold 15px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(product.code, width/2, headerHeight/2);

      let y = headerHeight;
      product.stages.forEach(s=>{
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0,y,width,rowHeight);
        ctx.fillStyle = '#000000';
        ctx.font = '13px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(s.name).toUpperCase(), colSplit/2, y+rowHeight/2);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 13px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(stageQty(s)), colSplit+(width-colSplit)/2, y+rowHeight/2);
        y += rowHeight;
      });

      // TOTAL row — bold
      ctx.fillStyle = '#F0F0F5';
      ctx.fillRect(0,y,width,rowHeight);
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 13px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('TOTAL', colSplit/2, y+rowHeight/2);
      ctx.textAlign = 'center';
      ctx.fillText(String(productTotalQty(product)), colSplit+(width-colSplit)/2, y+rowHeight/2);
      y += rowHeight;

      // grid lines
      ctx.strokeStyle = '#AAAAAA';
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5,0.5,width-1,height-1);
      ctx.beginPath();
      for(let gy=headerHeight; gy<=height; gy+=rowHeight){
        ctx.moveTo(0, Math.round(gy)+0.5);
        ctx.lineTo(width, Math.round(gy)+0.5);
      }
      ctx.moveTo(colSplit+0.5, headerHeight);
      ctx.lineTo(colSplit+0.5, height);
      ctx.stroke();

      shareOrDownloadCanvas(canvas, `${product.code}.png`);
    }catch(e){
      console.error('Product image export failed', e);
      showToast('Image generation failed — try again');
    }
  }

  // ---------- Share (Web Share API) with automatic download fallback ----------
  function shareOrDownloadCanvas(canvas, filename){
    canvas.toBlob(async (blob)=>{
      if(!blob){ showToast('Failed — try again'); return; }
      try{
        const file = new File([blob], filename, { type:'image/png' });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          try{
            await navigator.share({ files:[file], title: filename });
            return;
          }catch(shareErr){
            if(shareErr && shareErr.name==='AbortError') return; // user cancelled the share sheet
            console.error('Share failed, falling back to download', shareErr);
          }
        }
      }catch(e){ console.error('Share check failed', e); }
      // Fallback: plain download (desktop browsers / no Web Share support)
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Downloaded (share not supported here)');
    }, 'image/png');
  }

  // ---------- Consolidated image: all products, one sheet, matches CONSOL reference layout ----------
  // For a stage literally named "OTHERS", break its total into rows keyed by each entry's
  // remark text (e.g. "RW IN SMT -- 48") instead of a single generic "OTHERS" row.
  function stageDisplayRows(stage){
    const nameUpper = String(stage.name||'').trim().toUpperCase();
    if(nameUpper === OTHERS_KEY){
      const groups = {}; const order = [];
      (stage.entries||[]).forEach(e=>{
        const label = (e.remarks && e.remarks.trim()) ? e.remarks.trim().toUpperCase() : OTHERS_KEY;
        if(!(label in groups)){ groups[label]=0; order.push(label); }
        groups[label] += Number(e.qty||0);
      });
      if(order.length===0) return [{ label: OTHERS_KEY, qty: 0 }];
      return order.map(l=>({ label:l, qty:groups[l] }));
    }
    return [{ label: nameUpper, qty: stageQty(stage) }];
  }

  function productDisplayRows(product){
    let rows = [];
    product.stages.forEach(s=>{ rows = rows.concat(stageDisplayRows(s)); });
    rows.push({ label:'TOTAL', qty: productTotalQty(product), isTotal:true });
    return rows;
  }

  function fitBoldFont(ctx, text, maxWidth, baseSize){
    let size = baseSize;
    ctx.font = `bold ${size}px Arial, sans-serif`;
    while(ctx.measureText(text).width > maxWidth && size > 7){
      size -= 0.5;
      ctx.font = `bold ${size}px Arial, sans-serif`;
    }
    return size;
  }

  function exportConsolImage(){
    if(!state || !state.products || state.products.length===0){ showToast('No products to export'); return; }
    try{
      const products = sortedProducts();
      const COLS = 3;
      const COL_W = 320;
      const COL_GAP = 14;
      const ROW_GAP = 16;
      const MARGIN = 12;
      const HEADER_H = 30;
      const ROW_H = 24;
      const SCALE = 2;
      const colSplit = Math.round(COL_W*0.62);

      // Pre-compute each product's rows + pixel height
      const items = products.map(p=>{
        const rows = productDisplayRows(p);
        const h = HEADER_H + rows.length*ROW_H;
        return { p, rows, h };
      });

      // Layout in row-major bands of COLS; band height = tallest item in that band
      let totalHeight = MARGIN;
      const bands = [];
      for(let i=0;i<items.length;i+=COLS){
        const band = items.slice(i, i+COLS);
        const bandH = Math.max(...band.map(b=>b.h));
        bands.push({ items:band, h:bandH, y:totalHeight });
        totalHeight += bandH + ROW_GAP;
      }
      totalHeight += MARGIN - ROW_GAP;
      const width = MARGIN*2 + COLS*COL_W + (COLS-1)*COL_GAP;

      const canvas = document.createElement('canvas');
      canvas.width = width*SCALE;
      canvas.height = totalHeight*SCALE;
      const ctx = canvas.getContext('2d');
      ctx.scale(SCALE, SCALE);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,width,totalHeight);

      bands.forEach(band=>{
        band.items.forEach((item, colIdx)=>{
          const x = MARGIN + colIdx*(COL_W+COL_GAP);
          const y = band.y;
          const { p, rows, h } = item;

          // header
          ctx.fillStyle = '#33FF99';
          ctx.fillRect(x, y, COL_W, HEADER_H);
          ctx.fillStyle = '#0A2E1E';
          const hf = fitBoldFont(ctx, p.code, COL_W-16, 14);
          ctx.font = `bold ${hf}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.code, x+COL_W/2, y+HEADER_H/2);

          // rows
          let ry = y+HEADER_H;
          rows.forEach(row=>{
            ctx.fillStyle = row.isTotal ? '#F0F0F5' : '#FFFFFF';
            ctx.fillRect(x, ry, COL_W, ROW_H);

            ctx.fillStyle = '#000000';
            const lf = fitBoldFont(ctx, row.label, colSplit-14, 11);
            ctx.font = `${row.isTotal?'bold':'600'} ${lf}px Arial, sans-serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(row.label, x+8, ry+ROW_H/2);

            ctx.font = `bold 12px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(String(row.qty), x+colSplit+(COL_W-colSplit)/2, ry+ROW_H/2);

            ry += ROW_H;
          });

          // borders
          ctx.strokeStyle = '#AAAAAA';
          ctx.lineWidth = 1;
          ctx.strokeRect(x+0.5, y+0.5, COL_W-1, h-1);
          ctx.beginPath();
          for(let gy=y+HEADER_H; gy<=y+h; gy+=ROW_H){
            ctx.moveTo(x, Math.round(gy)+0.5);
            ctx.lineTo(x+COL_W, Math.round(gy)+0.5);
          }
          ctx.moveTo(x+colSplit+0.5, y+HEADER_H);
          ctx.lineTo(x+colSplit+0.5, y+h);
          ctx.stroke();
        });
      });

      showToast('Preparing CONSOL image…');
      shareOrDownloadCanvas(canvas, `ECON_WIP_Consol_${todayISO()}.png`);
    }catch(e){
      console.error('Consol image export failed', e);
      showToast('Image generation failed — try again');
    }
  }

  // ---------- Touch-friendly drag to reorder ----------
  function setupSortable(container){
    let dragEl=null, placeholder=null, pointerId=null, offsetY=0;

    function onPointerMove(e){
      if(!dragEl) return;
      const y = e.clientY - offsetY;
      dragEl.style.top = y + 'px';
      const rows = Array.from(container.querySelectorAll(':scope > [data-id]')).filter(el=>el!==dragEl);
      let target = null;
      for(const sib of rows){
        const r = sib.getBoundingClientRect();
        if(e.clientY < r.top + r.height/2){ target = sib; break; }
      }
      if(target) container.insertBefore(placeholder, target);
      else container.appendChild(placeholder);
    }

    function onPointerUp(){
      if(!dragEl) return;
      try{ dragEl.releasePointerCapture(pointerId); }catch(e){}
      dragEl.removeEventListener('pointermove', onPointerMove);
      dragEl.removeEventListener('pointerup', onPointerUp);
      dragEl.removeEventListener('pointercancel', onPointerUp);
      dragEl.style.position=''; dragEl.style.top=''; dragEl.style.left='';
      dragEl.style.width=''; dragEl.style.zIndex=''; dragEl.classList.remove('dragging');
      container.insertBefore(dragEl, placeholder);
      placeholder.remove();

      const ids = Array.from(container.querySelectorAll(':scope > [data-id]')).map(el=>el.dataset.id);
      const arr = getCurrentArray();
      arr.sort((a,b)=> ids.indexOf(a.id) - ids.indexOf(b.id));
      dragEl = null; placeholder = null;
      const n = currentNav();
      if(n.view!=='products' && n.productId){
        const p = findProduct(n.productId);
        if(p) p.updatedAt = new Date().toISOString();
      }
      saveState();
    }

    container.addEventListener('pointerdown', (e)=>{
      const handle = e.target.closest('.drag-handle');
      if(!handle) return;
      const row = handle.closest('[data-id]');
      if(!row) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      offsetY = e.clientY - rect.top;
      dragEl = row;
      pointerId = e.pointerId;
      placeholder = document.createElement('div');
      placeholder.className = 'drag-placeholder';
      placeholder.style.height = rect.height + 'px';
      row.parentNode.insertBefore(placeholder, row.nextSibling);
      row.style.position = 'fixed';
      row.style.top = rect.top + 'px';
      row.style.left = rect.left + 'px';
      row.style.width = rect.width + 'px';
      row.style.zIndex = 1000;
      row.classList.add('dragging');
      row.setPointerCapture(pointerId);
      row.addEventListener('pointermove', onPointerMove);
      row.addEventListener('pointerup', onPointerUp);
      row.addEventListener('pointercancel', onPointerUp);
    });
  }


  function buildExcelRowsFromState(){
    return sortedProducts().map(p=>{
      const sums={}; STAGE_COLUMNS.forEach(c=>sums[c]=0); sums[OTHERS_KEY]=0;
      const remarks=[];
      (p.stages||[]).forEach(s=>{
        const key=resolveStageKey(s), qty=stageQty(s);
        if(Object.prototype.hasOwnProperty.call(sums,key)) sums[key]+=qty;
        else sums[OTHERS_KEY]+=qty;
        if(key===OTHERS_KEY && qty) remarks.push(`${qty}-${s.name}`);
      });
      const total=TOTAL_COLUMNS.reduce((sum,c)=>sum+(sums[c]||0),0);
      return {product:p.code,sums,total,remarks:remarks.join('\\n')};
    });
  }

  async function exportEditableExcel(table){
    if(typeof ExcelJS==='undefined'){showToast('Export library failed to load — check connection');return;}
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('Export',{views:[{state:'frozen',xSplit:1,ySplit:1}]});
    const headers=Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
    ws.addRow(headers);
    ws.getRow(1).eachCell(cell=>{
      cell.font={bold:true,color:{argb:'FF1C1C1E'}};
      cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFBEDCEA'}};
      cell.border={top:{style:'thin',color:{argb:'FFAAB6BE'}},left:{style:'thin',color:{argb:'FFAAB6BE'}},bottom:{style:'thin',color:{argb:'FFAAB6BE'}},right:{style:'thin',color:{argb:'FFAAB6BE'}}};
    });
    table.querySelectorAll('tbody tr').forEach(tr=>{
      const vals=Array.from(tr.children).map((td,i)=>{
        const raw=td.textContent.trim();
        if(i>0 && i<headers.length-1 && raw!==''){
          const n=Number(raw.replace(/,/g,''));
          return Number.isFinite(n)?n:raw;
        }
        return raw;
      });
      ws.addRow(vals);
    });
    ws.columns.forEach((col,i)=>col.width=i===0?20:(i===headers.length-1?34:13));
    const buffer=await wb.xlsx.writeBuffer();
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`ECON_WIP_Excel_Report_${todayISO()}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast('Editable Excel report exported');
  }
