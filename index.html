<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ECON WIP TrackeR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1C1E;
    --paper:#F5F5F3;
    --steel:#E8E8E5;
    --steel-press:#DEDEDA;
    --blue:#5B8DEF;
    --blue-press:#4A79D9;
    --amber:#E6A23C;
    --amber-tint:#FBEBD2;
    --rule:#D8D8D4;
    --danger:#D0564A;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:90%; margin:0; }
  body{
    font-family:var(--sans);
    background:var(--ink);
    color:var(--ink);
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
  }
  #shell{
    width:100%;
    max-width:480px;
    height:100vh;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,0.5);
  }

  /* App bar */
  .appbar{
    flex:0 0 auto;
    padding:18px 20px 14px;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    position:relative;
    z-index:5;
  }
  .appbar-row{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:32px;
  }
  .back-btn{
    width:32px; height:32px; flex:0 0 32px;
    border:none; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px; color:var(--ink);
  }
  .back-btn:active{ background:var(--steel); }
  .appbar-title{
    font-size:20px; font-weight:700; letter-spacing:-0.01em;
    flex:1; text-align:center; margin-right:32px;
  }
  .appbar-title.mono{ font-family:var(--mono); font-size:17px; letter-spacing:0; }
  .appbar-title.root{ margin-right:0; }
  .appbar-sub{
    text-align:center; font-size:12px; color:#77776F; margin-top:3px;
    font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em;
  }
  .sync-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;
    background:#B3B3AA; vertical-align:middle;
  }
  .sync-dot.on{ background:#4CAF6D; }
  .sync-dot.err{ background:var(--danger); }

  .search-wrap{ padding:14px 20px 4px; }
  .search{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--rule); border-radius:12px;
    padding:11px 14px; color:#8A8A83;
  }
  .search input{
    border:none; outline:none; background:transparent; font-family:var(--sans);
    font-size:15px; color:var(--ink); width:100%;
  }
  .search input::placeholder{ color:#A6A69D; }

  /* Scroll area */
  .scroll{
    flex:1; overflow-y:auto; padding:14px 20px 100px;
    -webkit-overflow-scrolling:touch;
  }

  .summary-card{
    background:var(--ink); color:var(--paper); border-radius:16px;
    padding:20px; margin-bottom:16px; display:flex; align-items:baseline; justify-content:space-between;
  }
  .summary-num{ font-family:var(--mono); font-size:36px; font-weight:600; letter-spacing:-0.02em; }
  .summary-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:#B8B8AE; }

  .row{
    background:var(--steel);
    border-radius:14px;
    padding:14px 14px;
    display:flex; align-items:center; gap:6px;
    margin-bottom:5px;
    cursor:pointer;
    transition:background .12s ease;
    position:relative;
  }
  .row:active{ background:var(--steel-press); }
  .row.dragging{ box-shadow:0 14px 28px rgba(0,0,0,0.28); background:#fff; }
  .row-icon{
    width:36px; height:36px; flex:0 0 36px; border-radius:9px;
    background:#fff; display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-sub{ font-size:12px; color:#7A7A72; margin-top:2px; }
  .pill{
    font-family:var(--mono); font-size:12px; font-weight:600;
    background:var(--amber-tint); color:#8A5A16; border:1px solid #E9CE9B;
    padding:4px 9px; border-radius:20px; white-space:nowrap; flex:0 0 auto;
  }
  .chev{ color:#B3B3AA; flex:0 0 auto; }
  .drag-handle{
    width:22px; flex:0 0 22px; display:flex; align-items:center; justify-content:center;
    color:#B3B3AA; cursor:grab; touch-action:none; margin-left:-4px;
  }
  .drag-handle:active{ cursor:grabbing; color:var(--ink); }
  .drag-placeholder{
    border:2px dashed #C6C6C0; border-radius:14px; margin-bottom:10px; background:transparent;
  }
  .edit-btn, .del-btn{
    width:30px; height:30px; flex:0 0 30px; border:none; background:transparent;
    color:#B3B3AA; border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .edit-btn:active{ background:#00000010; color:var(--blue); }
  .del-btn:active{ background:#00000010; color:var(--danger); }

  .entry-card{
    background:var(--steel); border-radius:14px; padding:10px; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:2px;
  }
  .entry-date{ font-family:var(--mono); font-size:12px; color:#7A7A72; letter-spacing:0.02em; }
  .entry-remark{ font-size:15px; margin-top:4px; line-height:1.35; word-break:break-word; }

  .empty{
    text-align:center; padding:60px 20px; color:#8A8A83;
  }
  .empty-icon{ font-size:34px; margin-bottom:10px; opacity:.6; }
  .empty-title{ font-weight:600; color:var(--ink); font-size:15px; margin-bottom:4px; }
  .empty-sub{ font-size:13px; }

  /* FAB */
  .fab{
    position:absolute; right:16px; bottom:90px; width:56px; height:56px; border-radius:18px;
    background:var(--blue); color:#fff; border:none; box-shadow:0 8px 20px rgba(91,141,239,0.45);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;
  }
  .fab:active{ background:var(--blue-press); transform:scale(0.96); }

  /* Sheet */
  .overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.4); z-index:30;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:22px 22px 0 0;
    padding:10px 20px 26px; z-index:31; transform:translateY(105%); transition:transform .25s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 -10px 30px rgba(0,0,0,0.2);
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:var(--rule); border-radius:3px; margin:6px auto 16px; }
  .sheet-title{ font-size:17px; font-weight:700; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:#7A7A72; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; border:1px solid var(--rule); border-radius:11px; padding:12px 13px;
    font-family:var(--sans); font-size:15px; background:var(--paper); color:var(--ink); outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--blue); }
  .field input.mono{ font-family:var(--mono); }
  .field textarea{ resize:none; min-height:64px; font-family:var(--sans); }
  .sheet-actions{ display:flex; gap:6px; margin-top:6px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px; font-family:var(--sans);
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:active{ opacity:0.85; }
  .btn-ghost{ background:var(--steel); color:var(--ink); }
  .btn-ghost:active{ background:var(--steel-press); }

  .toast{
    position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>

<script>
(function(){
  // ===== USER ID + PASSWORD AUTHENTICATION =====
  const AUTH_DOC = db.collection('appAuth').doc('users');
  const REQUESTS_DOC = db.collection('appAuth').doc('resetRequests');
  const OWNER_ID = 'owner';
  const DEFAULT_OWNER_PASSWORD = 'ChangeMe@2026';
  let currentUser = null;
  let authUsers = {};
  let resetRequests = {};

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadRequestsOnce(){
    try{
      const snap = await REQUESTS_DOC.get();
      resetRequests = snap.exists ? (snap.data().requests || {}) : {};
    }catch(e){ console.error(e); resetRequests = {}; }
  }

  function pendingCount(){
    return Object.values(resetRequests).filter(r=>r && r.status==='pending').length;
  }

  function renderResetRequestsList(){
    const list = document.getElementById('resetRequestsList');
    if(!list) return;
    const pending = Object.entries(resetRequests).filter(([id,r])=>r && r.status==='pending');
    if(pending.length===0){
      list.innerHTML = '<div id="noRequests">No pending requests</div>';
      return;
    }
    list.innerHTML = pending.map(([reqId,r])=>`
      <div class="reset-req-row">
        <div class="rr-top"><span>${esc(r.userId)}</span><span class="rr-type">${r.type==='forgot'?'Forgot password':'Change request'}</span></div>
        <div class="rr-sub">Requested ${new Date(r.requestedAt).toLocaleString()}</div>
        <div class="rr-note">Requested new password: <strong>${esc(r.newPassword)}</strong></div>
        <div class="rr-actions">
          <button type="button" class="rr-set" data-approve="${reqId}">Approve</button>
          <button type="button" class="rr-dismiss" data-reject="${reqId}">Reject</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-approve]').forEach(btn=>{
      btn.onclick = async ()=>{
        const reqId = btn.dataset.approve;
        const r = resetRequests[reqId];
        if(!authUsers[r.userId]){ ownerMessage('User no longer exists'); return; }
        try{
          authUsers[r.userId].password = r.newPassword;
          resetRequests[reqId].status='resolved';
          resetRequests[reqId].resolvedAt=new Date().toISOString();
          await AUTH_DOC.set({users:authUsers});
          await REQUESTS_DOC.set({requests:resetRequests});
          ownerMessage('Password updated for '+r.userId, true);
          renderResetRequestsList();
          renderUsersList();
        }catch(e){
          console.error(e);
          ownerMessage('Could not update. Check connection.');
        }
      };
    });
    list.querySelectorAll('[data-reject]').forEach(btn=>{
      btn.onclick = async ()=>{
        const reqId = btn.dataset.reject;
        try{
          resetRequests[reqId].status='rejected';
          await REQUESTS_DOC.set({requests:resetRequests});
          renderResetRequestsList();
        }catch(e){ console.error(e); }
      };
    });
  }

  function renderUsersList(){

  async function loadUsers(){
    const snap=await AUTH_DOC.get();
    if(snap.exists){
      authUsers=snap.data().users || {};
      // Migration: older versions of this app stored a hashed password
      // (field passwordHash) instead of plain "password". Any account still
      // missing a "password" field is repaired here so logins keep working.
      let needsSave=false;
      if(!authUsers[OWNER_ID]){
        authUsers[OWNER_ID]={ password:DEFAULT_OWNER_PASSWORD, role:'owner', active:true, createdAt:new Date().toISOString() };
        needsSave=true;
      } else if(!authUsers[OWNER_ID].password){
        authUsers[OWNER_ID].password=DEFAULT_OWNER_PASSWORD;
        needsSave=true;
      }
      Object.keys(authUsers).forEach(id=>{
        if(id===OWNER_ID) return;
        if(!authUsers[id].password){
          authUsers[id].password='ResetMe@123';
          needsSave=true;
        }
      });
      if(needsSave){ await AUTH_DOC.set({users:authUsers}); }
      return;
    }
    authUsers={
      [OWNER_ID]:{
        password:DEFAULT_OWNER_PASSWORD,
        role:'owner',
        active:true,
        createdAt:new Date().toISOString()
      }
    };
    await AUTH_DOC.set({users:authUsers});

  function startWipApp(user){
  let state = null;
  let syncStatus = 'connecting'; // connecting | on | err
  let nav = [{ view:'products' }]; // stack of {view, productId, stageId}
  let searchTerm = '';

  // Read-only users can view everything but cannot add, edit, delete or reorder.
  // Only the owner can grant write access (see Users panel).
  function canWrite(){
    return user.role==='owner' || user.access!=='read';
  }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function seed(){
    return {
      products:[
        { id:uid(), code:'A897-064-3206-00', stages:[] },
        { id:uid(), code:'A897-064-3207-00', stages:[] },
        { id:uid(), code:'A897-064-3208-00', stages:[] }
      ]
    };
  }

  // ---------- Firestore sync (shared, multi-user) ----------
  function subscribeState(){
    stateDocRef.onSnapshot(async (docSnap)=>{
      if(docSnap.exists){
        state = docSnap.data();
        syncStatus = 'on';
        render();
      } else {
        state = seed();
        try{ await stateDocRef.set(state); syncStatus='on'; }
        catch(e){ syncStatus='err'; console.error(e); }
        render();
      }
    }, (err)=>{
      console.error('Firestore sync error', err);
      syncStatus = 'err';
      showToast('Sync error — check Firebase config / rules');
      render();
    });
  }

  async function saveState(){
    try{ await stateDocRef.set(state); }
    catch(e){
      console.error('Save failed', e);
      showToast('Save failed — check connection');
    }
  }

  function currentNav(){ return nav[nav.length-1]; }

  function findProduct(id){ return state.products.find(p=>p.id===id); }
  function findStage(productId, stageId){
    const p = findProduct(productId);
    return p ? p.stages.find(s=>s.id===stageId) : null;
  }
  function stageQty(stage){ return stage.entries.reduce((sum,e)=>sum+Number(e.qty||0),0); }
  function productQty(product){ return product.stages.reduce((sum,s)=>sum+stageQty(s),0); }

  function getCurrentArray(){
    const n = currentNav();
    if(n.view==='products') return state.products;
    if(n.view==='stages'){ const p = findProduct(n.productId); return p ? p.stages : []; }
    if(n.view==='entries'){ const s = findStage(n.productId, n.stageId); return s ? s.entries : []; }
    return [];
  }

  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });
  }

  function todayISO(){
    const d = new Date();
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime()-off*60000);
    return local.toISOString().slice(0,10);
  }

  function icon(name){
    if(name==='back') return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
    if(name==='chev') return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
    if(name==='crate') return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M3 11h18"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"/></svg>';
    if(name==='layer') return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>';
    if(name==='trash') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    if(name==='pencil') return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    if(name==='drag') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
    return '';
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  function confirmDelete(msg, onYes){
    if(window.confirm(msg)) onYes();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str==null? '' : String(str);
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str==null?'':str)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
  }

  // ---------- Sheets (Add / Edit share the same UI) ----------
  function openSheet(html){

  function openEntrySheet(productId, stageId, existing){
    const isEdit = !!existing;
    openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">${isEdit ? 'Edit entry' : 'Log entry'}</div>
      <div class="field">
        <label>Date</label>
        <input class="mono" type="date" id="inpDate" value="${isEdit ? escapeAttr(existing.date) : todayISO()}">
      </div>
      <div class="field">
        <label>Remarks</label>
        <textarea id="inpRemarks" placeholder="Notes about this entry">${isEdit ? escapeHtml(existing.remarks||'') : ''}</textarea>
      </div>
      <div class="field">
        <label>Quantity</label>
        <input class="mono" type="number" inputmode="numeric" id="inpQty" placeholder="0" value="${isEdit ? escapeAttr(existing.qty) : ''}">
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">${isEdit ? 'Save changes' : 'Save entry'}</button>
      </div>
    `);
    document.getElementById('cancelBtn').onclick = closeSheet;
    document.getElementById('saveBtn').onclick = ()=>{
      const date = document.getElementById('inpDate').value || todayISO();
      const remarks = document.getElementById('inpRemarks').value.trim();
      const qty = Number(document.getElementById('inpQty').value || 0);
      if(isEdit){
        existing.date = date; existing.remarks = remarks; existing.qty = qty;
        showToast('Entry updated');
      } else {
        const stage = findStage(productId, stageId);
        stage.entries.unshift({ id:uid(), date, remarks, qty });
        showToast('Entry saved');
      }
      saveState();
      closeSheet();
      render();
    };
  }

  // ---------- Touch-friendly drag to reorder ----------
  function setupSortable(container){
    let dragEl=null, placeholder=null, pointerId=null, offsetY=0;

    function onPointerMove(e){
      if(!dragEl) return;
      const y = e.clientY - offsetY;
      dragEl.style.top = y + 'px';
      const rows = Array.from(container.querySelectorAll(':scope > [data-id]')).filter(el=>el!==dragEl);
      let target = null;
      for(const sib of rows){
        const r = sib.getBoundingClientRect();
        if(e.clientY < r.top + r.height/2){ target = sib; break; }
      }
      if(target) container.insertBefore(placeholder, target);
      else container.appendChild(placeholder);
    }

    function onPointerUp(){
      if(!dragEl) return;
      try{ dragEl.releasePointerCapture(pointerId); }catch(e){}
      dragEl.removeEventListener('pointermove', onPointerMove);
      dragEl.removeEventListener('pointerup', onPointerUp);
      dragEl.removeEventListener('pointercancel', onPointerUp);
      dragEl.style.position=''; dragEl.style.top=''; dragEl.style.left='';
      dragEl.style.width=''; dragEl.style.zIndex=''; dragEl.classList.remove('dragging');
      container.insertBefore(dragEl, placeholder);
      placeholder.remove();

      const ids = Array.from(container.querySelectorAll(':scope > [data-id]')).map(el=>el.dataset.id);
      const arr = getCurrentArray();
      arr.sort((a,b)=> ids.indexOf(a.id) - ids.indexOf(b.id));
      dragEl = null; placeholder = null;
      saveState();
    }

    container.addEventListener('pointerdown', (e)=>{
      if(!canWrite()) return;
      const handle = e.target.closest('.drag-handle');
      if(!handle) return;
      const row = handle.closest('[data-id]');
      if(!row) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      offsetY = e.clientY - rect.top;
      dragEl = row;
      pointerId = e.pointerId;
      placeholder = document.createElement('div');
      placeholder.className = 'drag-placeholder';
      placeholder.style.height = rect.height + 'px';
      row.parentNode.insertBefore(placeholder, row.nextSibling);
      row.style.position = 'fixed';
      row.style.top = rect.top + 'px';
      row.style.left = rect.left + 'px';
      row.style.width = rect.width + 'px';
      row.style.zIndex = 1000;
      row.classList.add('dragging');
      row.setPointerCapture(pointerId);
      row.addEventListener('pointermove', onPointerMove);
      row.addEventListener('pointerup', onPointerUp);
      row.addEventListener('pointercancel', onPointerUp);
    });
  }

  // ---------- Rendering ----------
  function render(){
    if(!state) return;
    const n = currentNav();
    const appbar = document.getElementById('appbar');
    const searchWrap = document.getElementById('searchWrap');
    const scroll = document.getElementById('scroll');
    const fab = document.getElementById('fab');
    const dotClass = syncStatus==='on' ? 'on' : (syncStatus==='err' ? 'err' : '');

    if(n.view==='products'){
      const isOwnerUser = window.__auth && window.__auth.isOwner();
      appbar.innerHTML = `<div class="appbar-row">
        <div class="appbar-title root"><span class="sync-dot ${dotClass}"></span>ECON WIP TrackeR${!canWrite() ? `<span class="view-only-badge">View only</span>` : ''}</div>
        ${isOwnerUser ? `<button class="btn btn-ghost" id="usersBtn" style="flex:0 0 auto;padding:8px 10px;font-size:12px;">Users${pendingCount()>0 ? `<span class="req-badge">${pendingCount()}</span>` : ''}</button>` : ''}
        ${!isOwnerUser ? `<button class="btn btn-ghost" id="changePwBtn" style="flex:0 0 auto;padding:8px 10px;font-size:12px;">Change PW</button>` : ''}
        <button class="btn btn-ghost" id="logoutBtn" style="flex:0 0 auto;padding:8px 10px;font-size:12px;">Logout</button>
      </div>`;
      searchWrap.style.display = 'block';
      renderProducts(scroll);
      fab.style.display = canWrite() ? 'flex' : 'none';
      fab.onclick = ()=>openProductSheet(null);
      document.getElementById('logoutBtn').onclick = window.__auth.logout;
      const usersBtn = document.getElementById('usersBtn');
      if(usersBtn) usersBtn.onclick = window.__auth.showOwnerPanel;
      const cpBtn = document.getElementById('changePwBtn');
      if(cpBtn) cpBtn.onclick = window.__auth.openChangePasswordRequest;
    }
    else if(n.view==='stages'){
      const product = findProduct(n.productId);
      if(!product){ nav = [{view:'products'}]; render(); return; }
      appbar.innerHTML = `
        <div class="appbar-row">
          <button class="back-btn" id="backBtn">${icon('back')}</button>
          <div class="appbar-title mono">${escapeHtml(product.code)}</div>
        </div>
        <div class="appbar-sub">${product.stages.length} stage${product.stages.length===1?'':'s'}</div>
      `;
      searchWrap.style.display = 'none';
      renderStages(scroll, product);
      fab.style.display = canWrite() ? 'flex' : 'none';
      fab.onclick = ()=>openStageSheet(product.id, null);
      document.getElementById('backBtn').onclick = ()=>{ nav.pop(); render(); };
    }
    else if(n.view==='entries'){
      const product = findProduct(n.productId);
      const stage = product ? findStage(n.productId, n.stageId) : null;
      if(!product || !stage){ nav = [{view:'products'}]; render(); return; }
      appbar.innerHTML = `
        <div class="appbar-row">
          <button class="back-btn" id="backBtn">${icon('back')}</button>
          <div class="appbar-title">${escapeHtml(stage.name)}</div>
        </div>
        <div class="appbar-sub">${escapeHtml(product.code)}</div>
      `;
      searchWrap.style.display = 'none';
      renderEntries(scroll, product, stage);
      fab.style.display = canWrite() ? 'flex' : 'none';
      fab.onclick = ()=>openEntrySheet(product.id, stage.id, null);
      document.getElementById('backBtn').onclick = ()=>{ nav.pop(); render(); };
    }
  }

  function renderProducts(scroll){
    const term = searchTerm.trim().toLowerCase();
    const list = state.products.filter(p=>p.code.toLowerCase().includes(term));
    if(state.products.length===0){
      scroll.innerHTML = emptyState('crate','No products yet','Tap + to add your first product');
      return;
    }
    if(list.length===0){
      scroll.innerHTML = emptyState('crate','No matches','Try a different search term');
      return;
    }
    const canDrag = term==='' && canWrite();
    scroll.innerHTML = list.map(p=>`
      <div class="row" data-id="${p.id}">
        ${canDrag ? `<div class="drag-handle">${icon('drag')}</div>` : ''}
        <div class="row-icon">${icon('crate')}</div>
        <div class="row-body">
          <div class="row-title">${escapeHtml(p.code)}</div>
          <div class="row-sub">${p.stages.length} stage${p.stages.length===1?'':'s'}</div>
        </div>
        ${canWrite() ? `<button class="edit-btn" data-edit="${p.id}">${icon('pencil')}</button>` : ''}
        ${canWrite() ? `<button class="del-btn" data-del="${p.id}">${icon('trash')}</button>` : ''}
        <div class="chev">${icon('chev')}</div>
      </div>
    `).join('');
    scroll.querySelectorAll('.row').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('[data-del]') || e.target.closest('[data-edit]') || e.target.closest('.drag-handle')) return;
        nav.push({ view:'stages', productId: row.dataset.id });
        render();
      });
    });
    scroll.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        openProductSheet(findProduct(btn.dataset.edit));
      });
    });
    scroll.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.del;
        const p = findProduct(id);
        confirmDelete(`Delete product ${p.code}? This removes all its stages and entries.`, ()=>{
          state.products = state.products.filter(x=>x.id!==id);
          saveState(); render();
        });
      });
    });
  }

  function renderStages(scroll, product){
    if(product.stages.length===0){
      scroll.innerHTML = emptyState('layer','No stages yet','Tap + to add a production stage');
      return;
    }
    scroll.innerHTML = product.stages.map(s=>`
      <div class="row" data-id="${s.id}">
        ${canWrite() ? `<div class="drag-handle">${icon('drag')}</div>` : ''}
        <div class="row-icon">${icon('layer')}</div>
        <div class="row-body">
          <div class="row-title" style="font-family:var(--sans);">${escapeHtml(s.name)}</div>
          <div class="row-sub">${s.entries.length} entr${s.entries.length===1?'y':'ies'}</div>
        </div>
        <div class="pill">${stageQty(s)} B</div>
        ${canWrite() ? `<button class="edit-btn" data-edit="${s.id}">${icon('pencil')}</button>` : ''}
        ${canWrite() ? `<button class="del-btn" data-del="${s.id}">${icon('trash')}</button>` : ''}
        <div class="chev">${icon('chev')}</div>
      </div>
    `).join('');
    scroll.querySelectorAll('.row').forEach(row=>{
      row.addEventListener('click',(e)=>{
        if(e.target.closest('[data-del]') || e.target.closest('[data-edit]') || e.target.closest('.drag-handle')) return;
        nav.push({ view:'entries', productId: product.id, stageId: row.dataset.id });
        render();
      });
    });
    scroll.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        openStageSheet(product.id, findStage(product.id, btn.dataset.edit));
      });
    });
    scroll.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const id = btn.dataset.del;
        const s = findStage(product.id, id);
        confirmDelete(`Delete stage "${s.name}"? This removes all its logged entries.`, ()=>{
          product.stages = product.stages.filter(x=>x.id!==id);
          saveState(); render();
        });
      });
    });
  }

  function renderEntries(scroll, product, stage){
    let html = `
      <div class="summary-card">
        <div>
          <div class="summary-label">Total logged</div>
          <div class="summary-num">${stageQty(stage)}</div>
        </div>
        <div class="summary-label">B</div>
      </div>
    `;
    if(stage.entries.length===0){
      html += emptyState('layer','No entries yet','Tap + to log a date, remark and quantity');
    } else {
      html += stage.entries.map(e=>`
        <div class="entry-card" data-id="${e.id}">
          ${canWrite() ? `<div class="drag-handle">${icon('drag')}</div>` : ''}
          <div style="flex:1; min-width:0;">
            <div class="entry-date">${formatDate(e.date)}</div>
            ${e.remarks ? `<div class="entry-remark">${escapeHtml(e.remarks)}</div>` : ''}
          </div>
          <div class="pill">${e.qty} B</div>
          ${canWrite() ? `<button class="edit-btn" data-edit="${e.id}">${icon('pencil')}</button>` : ''}
          ${canWrite() ? `<button class="del-btn" data-del="${e.id}">${icon('trash')}</button>` : ''}
        </div>
      `).join('');
    }
    scroll.innerHTML = html;
    scroll.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const entry = stage.entries.find(x=>x.id===btn.dataset.edit);
        openEntrySheet(product.id, stage.id, entry);
      });
    });
    scroll.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const id = btn.dataset.del;
        confirmDelete('Delete this entry?', ()=>{
          stage.entries = stage.entries.filter(x=>x.id!==id);
          saveState(); render();
        });
      });
    });
  }

  function emptyState(iconName, title, sub){
    return `<div class="empty">
      <div class="empty-icon">${icon(iconName)}</div>
      <div class="empty-title">${title}</div>
      <div class="empty-sub">${sub}</div>
    </div>`;
  }

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
  });

  // ---------- Start data sync ----------
  subscribeState();
  setupSortable(document.getElementById('scroll'));

  // Owner gets a live notification badge when a new password request comes in,
  // and the users list stays in sync with Firestore in real time.
  if(user.role==='owner'){
    AUTH_DOC.onSnapshot((snap)=>{
      authUsers = snap.exists ? (snap.data().users || {}) : authUsers;
      renderUsersList();
    }, (err)=>{ console.error('Users sync error', err); });
    REQUESTS_DOC.onSnapshot((snap)=>{
      resetRequests = snap.exists ? (snap.data().requests || {}) : {};
      render();
      renderResetRequestsList();
    }, (err)=>{ console.error('Requests sync error', err); });
  }
  }

  // ---------- Init ----------
  // Every time the page is opened, the login screen is shown — no auto login.
  (async function(){
    try{
      await loadUsers();
      await loadRequestsOnce();
      showLogin();
    }catch(e){
      console.error(e);
      authMessage('Firebase connection error — check Firestore rules/config');
    }
  })();
})();
</script>
