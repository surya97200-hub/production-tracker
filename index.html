        const id = btn.dataset.del;
        const s = findStage(product.id, id);
        confirmDelete(`Delete stage "${s.name}"? This removes all its logged entries.`, ()=>{
          product.stages = product.stages.filter(x=>x.id!==id);
          product.updatedAt = new Date().toISOString();
          saveState(); render();
        });
      });
    });
  }

  function renderEntries(scroll, product, stage){
    let html = `
      <div class="summary-card">
        <div>
          <div class="summary-label">Total logged</div>
          <div class="summary-num">${stageQty(stage)}</div>
        </div>
        <div class="summary-label">B</div>
      </div>
    `;
    if(stage.entries.length===0){
      html += emptyState('layer','No entries yet','Tap + to log a date, remark and quantity');
    } else {
      html += stage.entries.map(e=>`
        <div class="entry-card" data-id="${e.id}">
          ${canWrite ? `<div class="drag-handle">${icon('drag')}</div>` : ''}
          <div style="flex:1; min-width:0;">
            <div class="entry-date">${formatDate(e.date)}</div>
            ${e.remarks ? `<div class="entry-remark">${escapeHtml(e.remarks)}</div>` : ''}
          </div>
          <div class="pill">${e.qty} B</div>
          ${canWrite ? `<button class="edit-btn" data-edit="${e.id}">${icon('pencil')}</button>` : ''}
          ${canWrite ? `<button class="del-btn" data-del="${e.id}">${icon('trash')}</button>` : ''}
        </div>
      `).join('');
    }
    scroll.innerHTML = html;
    scroll.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        const entry = stage.entries.find(x=>x.id===btn.dataset.edit);
        openEntrySheet(product.id, stage.id, entry);
      });
    });
    scroll.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(!canWrite){ showToast('Read-only access'); return; }
        const id = btn.dataset.del;
        confirmDelete('Delete this entry?', ()=>{
          stage.entries = stage.entries.filter(x=>x.id!==id);
          product.updatedAt = new Date().toISOString();
          saveState(); render();
        });
      });
    });
  }

  function emptyState(iconName, title, sub){
    return `<div class="empty">
      <div class="empty-icon">${icon(iconName)}</div>
      <div class="empty-title">${title}</div>
      <div class="empty-sub">${sub}</div>
    </div>`;
  }

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
  });

  document.querySelectorAll('[data-side-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>navigateSidebar(btn.dataset.sideNav));
  });
  document.getElementById('dashboardModalClose')?.addEventListener('click', closeDashboardModal);
  document.getElementById('dashboardModal')?.addEventListener('click', (e)=>{
    if(e.target.id==='dashboardModal') closeDashboardModal();
  });

  // ---------- Start data sync ----------
  subscribeState();
  setupSortable(document.getElementById('scroll'));

  // Owner gets a live notification badge when a new password request comes in,
  // and the users list stays in sync with Firestore in real time.
  if(user.role==='owner'){
    AUTH_DOC.onSnapshot((snap)=>{
      authUsers = snap.exists ? (snap.data().users || {}) : authUsers;
      renderUsersList();
    }, (err)=>{ console.error('Users sync error', err); });
    REQUESTS_DOC.onSnapshot((snap)=>{
      resetRequests = snap.exists ? (snap.data().requests || {}) : {};
      render();
      renderResetRequestsList();
    }, (err)=>{ console.error('Requests sync error', err); });
  }
  }

  // ---------- Init ----------
  // Every time the page is opened, the login screen is shown — no auto login.
  (async function(){
    try{
      await loadUsers();
      await loadRequestsOnce();
      showLogin();
    }catch(e){
      console.error(e);
      authMessage('Firebase connection error — check Firestore rules/config');
    }
  })();
})();
</script>
</body>
</html>

  .consolidated-card{min-width:250px;background:#fff;border:1px solid #c8c8c8;color:#111;}
  .consolidated-product{background:#3fd38a;color:#10251d;font-size:18px;font-weight:800;text-align:center;padding:6px 8px;border-bottom:1px solid #bdbdbd;}
  .consolidated-rows{background:#fff;}
  .consolidated-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;min-height:24px;border-bottom:1px solid #d2d2d2;font-size:14px;font-weight:700;line-height:1.2;}
  .consolidated-row span{padding:4px 8px;border-right:1px solid #d2d2d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .consolidated-row span:last-child{text-align:center;border-right:0;font-weight:500;}

  .consolidated-total span:last-child{font-weight:800;}
  .detailed-report-panel{margin-top:16px;}
  @media(max-width:1100px){.consolidated-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:700px){.consolidated-grid{grid-template-columns:1fr;}}

  /* Excel Report is read-only in the web UI. */
  #excelReportView [contenteditable="true"],
  #excelReportView .edit-cell,
  #excelReportView .cell-edit,
  #excelReportView .save-report,
  #excelReportView .save-changes,
  #excelReportView .edit-report { pointer-events:none; }
  #excelReportView table td { cursor:default !important; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const root = document.getElementById('excelReportView');
  if(!root) return;
  root.querySelectorAll('[contenteditable]').forEach(el=>{
    el.removeAttribute('contenteditable');
    el.classList.remove('edit-cell','cell-edit');
  });
  root.querySelectorAll('td,th').forEach(el=>{
    el.oninput = null;
    el.onkeydown = null;
  });
});
</script>
